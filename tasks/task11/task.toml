schema_version = "1.4"
artifacts = ["/logs/artifacts"]

[task]
name = "rlebench/task11-online-bin-packing"
version = "0.1.0"
description = "Pack Amazon-style cartons arriving on a running conveyor into a fixed tote with a suction-tipped Franka Panda in MuJoCo. Open-ended: ship a closed-loop policy (scanner rows, belt encoder, RGB-D, joint state in; joint targets + suction out). Scored on hidden box streams by tote utilization at full, packing throughput and pick-and-place success, minus floor drops, box damage and tote strikes."
authors = [{ name = "Chang Shi", email = "changshi@utexas.edu" }]
keywords = ["robotics", "mujoco", "simulation", "manipulation", "bin-packing", "conveyor", "throughput", "custom-verifier"]

[metadata]
category = "robotics-manipulation"
difficulty = "hard"
tags = ["closed-loop-control", "online-3d-bin-packing", "moving-target-picking", "hidden-seeds", "cpu"]
difficulty_explanation = "Online 3D bin packing with physical execution: moving-target interception, placement planning under a stability rule with one-box lookahead, precise tote placement and speed, graded end-to-end on hidden box streams; rewards anchored to privileged and public reference packers."

[environment]
# Prebuilt by `make task11`; environment/ and tests/ remain the build inputs.
docker_image = "rlebench-task11-agent:dev"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 4096
storage_mb = 10240
network_mode = "no-network"

[agent]
timeout_sec = 7200.0

[verifier]
timeout_sec = 10800.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
docker_image = "rlebench-task11-verifier:dev"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 4096
storage_mb = 10240
network_mode = "no-network"
