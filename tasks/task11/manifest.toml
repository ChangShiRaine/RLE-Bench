# rlebench manifest: how this family is prepared and addressed. Read by the
# CLI only; ships into no image.
[task]
layout = "single"

[prepare]
commands = [["make", "task11"]]

[verify]
images = ["rlebench-task11-agent:dev", "rlebench-task11-verifier:dev"]
paths = ["tasks/task11/tests/score_task.py"]

[run]
lane = "environment-host"
gpu = false
