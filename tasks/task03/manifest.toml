# rlebench manifest: how this family is prepared and addressed. Read by the
# CLI only; ships into no image.
[task]
layout = "dataset"

[prepare]
commands = [["make", "task03"]]

[verify]
images = ["rlebench-task03-pocket-agent:dev", "rlebench-task03-agent:dev", "rlebench-task03-hidden-com-agent:dev"]
paths = ["tasks/task03/01-tower-max-height"]

[run]
lane = "agent-host"
gpu = true
resume_trajectory = false
