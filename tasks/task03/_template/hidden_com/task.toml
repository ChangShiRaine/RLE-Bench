schema_version = "1.4"
artifacts = ["/workspace"]

[task]
name = "rlebench/task03-05-hidden-center-of-mass"
version = "1.0.0"
description = "Identify three sealed boxes' hidden ballast quadrants using as few physical control steps as possible; submit once per box."
keywords = ["robotics", "mujoco", "robosuite", "physical-reasoning", "system-identification"]

[metadata]
category = "robotics-control"

[agent]
user = "agent"
timeout_sec = 3600.0
network_mode = "allowlist"
allowed_hosts = []

[environment]
docker_image = "rlebench-task03-hidden-com-agent:dev"
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
gpus = 1
network_mode = "public"

[environment.healthcheck]
command = "test -S /run/rlebench/hidden-com.sock"
interval_sec = 1.0
timeout_sec = 5.0
start_period_sec = 180.0

[verifier]
user = "root"
timeout_sec = 180.0
network_mode = "no-network"
