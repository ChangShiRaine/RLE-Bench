schema_version = "1.4"

multi_step_reward_strategy = "final"


artifacts = ["/workspace"]

[task]
name = "rlebench/task03-04-rubik-cube"
version = "1.0.0"
description = "Solve one scrambled physical 2x2 cube within 50000 steps using tilted arms and only the front camera."
authors = [{ name = "Haitong Ma", email = "haitongma@g.harvard.edu" }]
keywords = ["robotics", "robosuite", "mujoco", "simulation", "control", "embodied-reasoning", "sample-efficiency"]

[metadata]
category = "robotics-control"
difficulty_explanation = "Single continuous physical solve attempt; no training or subsequent evaluation battery."


[environment]
docker_image = "rlebench-task03-pocket-agent:dev"
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
network_mode = "public"
gpus = 1

[agent]
timeout_sec = 32400.0
user = "agent"
network_mode = "allowlist"
allowed_hosts = []


[environment.env]
RLEBENCH_TASK = "RubikCube"

RLEBENCH_LEVEL = "L1"

RLEBENCH_INTERACTION_STEPS = "@@INTERACTION_STEPS@@"

RLEBENCH_MAX_STEPS_PER_TRIAL = "@@INTERACTION_STEPS@@"

RLEBENCH_DEVELOP_SECONDS = "32400"
RLEBENCH_EVALUATE_SECONDS = "32400"


[environment.healthcheck]
command = "test -f /run/rlebench/ready"
interval_sec = 1.0
timeout_sec = 5.0
start_period_sec = 180.0

[[verifier.collect]]
command = "/opt/seal_ledger.sh"
user = "root"
timeout_sec = 120.0

[[verifier.collect]]
command = "chmod -R a+rwX /logs/agent /logs/artifacts 2>/dev/null; true"
user = "root"
timeout_sec = 60.0

[verifier]
timeout_sec = 180.0
user = "root"
network_mode = "no-network"

[verifier.env]
