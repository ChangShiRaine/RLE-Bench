# Task-authored compose overlay. Harbor layers this on top of its base +
# build/prebuilt templates (see harbor/environments/docker/docker.py
# _docker_compose_paths, "Option 2: Task with extra services"), then appends its
# own mounts overlay for logs/artifacts -- so this bind mount coexists with
# Harbor's infrastructure mounts rather than replacing them.
#
# This family needs no dataset mount.
services:
  main:
    # EGL rendering needs a real GPU, and this reservation is what attaches one under the
    # local Docker provider: Harbor's DockerEnvironment declares `capabilities.gpus =
    # False`, so a task.toml `gpus = 1` is REJECTED before the container starts. That
    # `gpus = 1` stays as the portable declaration for providers that schedule GPUs;
    # locally, run with `--override-gpus 0` so validation passes and the device comes
    # from here.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # WHICH gpu, not just how many: `count: 1` lets Docker pick, so two
              # concurrent runs can land on the same card while another sits idle.
              # a suite script can set this per slot.
              device_ids: ['${RLEBENCH_GPU:-0}']
              capabilities: [gpu]
    environment:
      # Per-run toggle, read straight from the shell that launched harbor, so turning
      # the live view on needs no edit to any file:
      #     RLEBENCH_DEBUG=1 harbor run -p tasks/task01 ...
      RLEBENCH_DEBUG: ${RLEBENCH_DEBUG:-0}
      # Scales the wall-clock the agent is TOLD it has, by the same factor
      # `harbor run --agent-timeout-multiplier` scales the timeout Harbor ENFORCES.
      # Both come from one Makefile variable, so the two cannot drift apart.
      RLEBENCH_TIMEOUT_MULT: ${RLEBENCH_TIMEOUT_MULT:-1}
    volumes:
      # The live debug tree, next to the run's other output: HOST_AGENT_LOGS_PATH is
      # jobs/<ts>/<trial>/agent, so its parent is the trial dir. A sibling of artifacts/,
      # never inside it -- anything under artifacts/ is uploaded and manifested, and this
      # is operator-facing. The container-side target is inside /opt/private (root 0700),
      # which is what keeps the agent out of it.
      - type: bind
        source: ${RLEBENCH_DEBUG_DIR:-${HOST_AGENT_LOGS_PATH:-/tmp/rlebench/agent}/../debug}
        target: /opt/private/debug
        bind:
          create_host_path: true
