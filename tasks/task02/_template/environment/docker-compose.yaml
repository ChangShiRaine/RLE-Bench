# Task-authored compose overlay. Harbor layers this on top of its base +
# build/prebuilt templates (see harbor/environments/docker/docker.py
# _docker_compose_paths, "Option 2: Task with extra services"), then appends its
# own mounts overlay for logs/artifacts -- so this bind mount coexists with
# Harbor's infrastructure mounts rather than replacing them.
#
# The RoboCasa asset tree is a separately versioned READ-ONLY dataset, not part of
# the code image: 123,434 files / ~15 GB, packed into a 9.6 GB zstd SquashFS.
# It is materialized once per node and mounted into every trial container.
#
# ROBOCASA_ASSET_DIR must point at a fully populated models/assets tree, e.g.
#   /mnt/robocasa-assets/v1.0.1     (SquashFS mounted at provisioning; see
#                                    `sim/robocasa/robocasa.sh assets mount`)
# A bind mount OBSCURES the image's content at the target, and 210 files under
# models/assets ship with the robocasa repo (120 scenes/, 84 fixtures/, plus
# arenas, box_links, novel_instructions). So the source MUST be the complete
# merged tree. Mounting individual heavy subdirectories is NOT safe: fixtures/
# mixes repo-tracked registry YAMLs with downloaded content.
#
# sim/robocasa/base/verify_assets.py asserts all of this at container start,
# including an asset-version match, so a stale mount fails loudly instead of
# silently changing the scenes.
services:
  main:
    # EGL rendering needs a real GPU. This reservation is what actually attaches one
    # under the local Docker provider: Harbor's DockerEnvironment declares
    # `capabilities.gpus = False` (only Beam/Daytona/OpenSandbox and conditionally
    # Modal/GKE declare True), so a task.toml `gpus = 1` is REJECTED before the
    # container starts rather than honoured. `gpus = 1` is kept in task.toml as the
    # portable declaration for providers that schedule GPUs; locally, run with
    # `--override-gpus 0` (see tasks/task02/README.md) so Harbor's validation passes and
    # the device comes from here instead.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # WHICH gpu, not just how many: `count: 1` lets Docker pick, so two
              # concurrent runs can land on the same card while another sits idle.
              # rlebench sweep sets this per slot.
              device_ids: ['${RLEBENCH_GPU:-0}']
              capabilities: [gpu]
    environment:
      # Per-run toggle, read straight from the shell that launched harbor, so turning
      # the live view on needs no edit to any file:
      #     RLEBENCH_DEBUG=1 harbor run -p tasks/task02 ...
      RLEBENCH_DEBUG: ${RLEBENCH_DEBUG:-0}
      # Scales the wall-clock the agent is TOLD it has, by the same factor
      # `harbor run --agent-timeout-multiplier` scales the timeout Harbor ENFORCES.
      # Both come from one Makefile variable, so the two cannot drift apart.
      RLEBENCH_TIMEOUT_MULT: ${RLEBENCH_TIMEOUT_MULT:-1}
    volumes:
      # The live debug tree. Defaults NEXT TO the run's other output, under the job
      # directory: Harbor exports its own mount sources to compose, and
      # HOST_AGENT_LOGS_PATH is jobs/<ts>/<trial>/agent, so its parent is the trial dir.
      #
      # A sibling of artifacts/, never inside it: anything under artifacts/ is uploaded
      # and manifested, and this is operator-facing output that should not enter that
      # path. The container-side target is inside /opt/private (root 0700), which is
      # what keeps the agent out of it -- see debug.py.
      - type: bind
        source: ${RLEBENCH_DEBUG_DIR:-${HOST_AGENT_LOGS_PATH:-/tmp/rlebench/agent}/../debug}
        target: /opt/private/debug
        bind:
          create_host_path: true
      - type: bind
        source: ${ROBOCASA_ASSET_DIR:?set ROBOCASA_ASSET_DIR to a populated models/assets tree}
        target: /opt/src/robocasa/robocasa/models/assets
        read_only: true
