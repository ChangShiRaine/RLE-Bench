services:
  main:
    shm_size: "16gb"
    pids_limit: 16384
    security_opt: ["no-new-privileges:true"]
    environment:
      NANOVLA_ACTION_DIM: "14"
      HOME: /tmp/nanovla-jit
      MPLCONFIGDIR: /tmp/nanovla-jit/mpl
      TORCHINDUCTOR_CACHE_DIR: /tmp/nanovla-jit/inductor
      TRITON_CACHE_DIR: /tmp/nanovla-jit/triton
      WARP_CACHE_PATH: /tmp/nanovla-jit/warp
      XDG_CACHE_HOME: /tmp/nanovla-jit/cache
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - type: bind
        source: ${NANOVLA_ROBOTWIN_SHARDS:?set NANOVLA_ROBOTWIN_SHARDS}
        target: /assets/nanovla/shards
        read_only: true
      - type: volume
        source: nanovla-eval
        target: /run/nanovla-eval
    depends_on:
      evaluator:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${RLEBENCH_GPU:-0}']
              capabilities: [gpu]
  # The evaluation service: the RoboTwin simulator and the development episode
  # lists live here, reachable from main only through the sockets in the shared directory.
  evaluator:
    image: rlebench-task05-robotwin-verifier-base:dev
    command: ["python3", "/opt/nanovla-verifier/eval_service.py", "--subtask", "04-robotwin-robustness", "--workers", "4"]
    network_mode: none
    read_only: true
    shm_size: "8gb"
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,exec,size=16g,mode=1777
    environment:
      NANOVLA_ACTION_DIM: "14"
      HOME: /tmp/nanovla-jit
      MPLCONFIGDIR: /tmp/nanovla-jit/mpl
      TORCHINDUCTOR_CACHE_DIR: /tmp/nanovla-jit/inductor
      TRITON_CACHE_DIR: /tmp/nanovla-jit/triton
      WARP_CACHE_PATH: /tmp/nanovla-jit/warp
      XDG_CACHE_HOME: /tmp/nanovla-jit/cache
      NVIDIA_DRIVER_CAPABILITIES: compute,graphics,utility
    volumes:
      - type: volume
        source: nanovla-eval
        target: /run/nanovla-eval
      - type: bind
        source: ${NANOVLA_EVAL_LOGS:-/tmp/rlebench-task05-eval-logs}
        target: /logs/eval-service
    healthcheck:
      test: ["CMD", "test", "-S", "/run/nanovla-eval/service.sock"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "16"
          memory: 32g
          pids: 4096
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${RLEBENCH_GPU:-0}']
              capabilities: [gpu]

volumes:
  nanovla-eval:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64m"
