services:
  main:
    read_only: true
    shm_size: "16gb"
    pids_limit: 16384
    cap_drop: [ALL]
    cap_add: [CHOWN, KILL, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,exec,size=64g,mode=1777
      - /logs/artifacts:rw,size=2m,mode=0755
      - /logs/nanovla-handoff:rw,size=2m,mode=0700
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,graphics,utility
    volumes:
      - type: bind
        source: ${NANOVLA_SHARDS_L10:?set NANOVLA_SHARDS_L10}
        target: /assets/nanovla/shards
        read_only: true
      - type: bind
        source: ${NANOVLA_LIBERO_PLUS_ASSETS:?set NANOVLA_LIBERO_PLUS_ASSETS}
        target: /opt/LIBERO-plus/libero/libero/assets
        read_only: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${RLEBENCH_GPU:-0}']
              capabilities: [gpu]
