[pytest]
testpaths = tests
# Tests that need a real RoboCasa environment -- the asset dataset mounted, MuJoCo able
# to make a context. They are deselected by default so `make test` stays runnable on a
# plain box. Run them with the RoboCasa dev venv and the asset tree in place:
#   MUJOCO_GL=egl ROBOCASA_ASSET_DIR=$PWD/third_party/robocasa/robocasa/models/assets \
#       make test TASK=task02 PY=.venv-robocasa/bin/python PYTEST_ARGS='-m simulator'
# Both are what `make sim-robocasa` sets up.
# That is where the equivalence between task02's stage functions and RoboCasa's own
# success predicates is actually checked.
markers =
    simulator: needs a live RoboCasa environment (run inside the task image)
    heavy: minutes-long physics/render regression; PR CI defers these to the nightly lane
addopts = -m "not simulator" --strict-markers --strict-config
# Local runs include heavy tests. PR CI selects "not heavy and not simulator";
# nightly CI selects "heavy and not simulator".
